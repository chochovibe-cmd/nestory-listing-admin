name: Mobile ResultCard R3 one-shot PR runner

on:
  pull_request:
    types: [opened]
    branches:
      - codex/nestory-v0.1-safety-skeleton

permissions:
  contents: write

jobs:
  apply-r3:
    if: github.event.pull_request.head.ref == 'agent/release-thumbnail-regression-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply reviewed R3 patch and squash scaffolding
        env:
          CLEAN_BASE: 00d8cda5163cc5cf4b92298a4d19c29fbba8ffe4
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/mobile-resultcard-r3.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n\n          node scripts/verify-mobile-resultcard-owner-refine.mjs"
          if start not in source or end not in source:
              raise SystemExit('Reviewed R3 patch markers not found')
          patch = source.split(start, 1)[1].split(end, 1)[0]
          Path('/tmp/r3_patch.py').write_text(textwrap.dedent(patch))
          PY

          python /tmp/r3_patch.py
          node scripts/verify-mobile-resultcard-owner-refine.mjs
          node scripts/verify-mobile-resultcard-expand.mjs
          node scripts/verify-mobile-layout-regression-restore.mjs
          git diff --check

          git config user.name "chochovibe-cmd"
          git config user.email "chochovibe@gmail.com"
          git reset --soft "$CLEAN_BASE"
          rm -f .github/workflows/mobile-resultcard-r3.yml
          rm -f .github/workflows/mobile-resultcard-structural-patch-temp.yml
          rm -f .github/workflows/mobile-resultcard-r3-pr-runner.yml
          git add -A
          git diff --cached --check
          git commit -m "style(mobile): finalize ResultCard owner layout R3"
          git push --force-with-lease=refs/heads/$BRANCH_NAME:$EXPECTED_HEAD origin HEAD:$BRANCH_NAME
