# Free isolated Supabase database gate.
# This workflow never links to the hosted project and requires no Supabase secrets.
name: Supabase Local Reconcile

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/test-supabase-reconcile-local.sh"
      - "scripts/test-supabase-role-rls-local.sh"
      - "scripts/test-supabase-function-hardening-local.sh"
      - "scripts/test-supabase-production-package-local.sh"
      - "scripts/test-publish-schedule-local.sh"
      - "scripts/test-publish-schedule-api-e2e.mjs"
      - "src/app/api/publish-schedules/**"
      - "src/lib/drafts/publishScheduleCore.ts"
      - "src/lib/shopify/runDuePublishSchedules.ts"
      - ".github/workflows/supabase-local.yml"
      - "scripts/verify-requirements.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize local-only Supabase config
        shell: bash
        run: |
          supabase init --force
          perl -0pi -e 's/major_version = \d+/major_version = 17/' supabase/config.toml
          grep -n "major_version" supabase/config.toml

      - name: Stage pre-tracking historical SQL outside active migration queue
        shell: bash
        run: |
          mkdir -p /tmp/nestory-migrations /tmp/nestory-forward-migrations
          cp supabase/history/pre_tracking_migrations/*.sql /tmp/nestory-migrations/
          cp supabase/migrations/20260822223100_variant_split_override_semantics.sql /tmp/nestory-forward-migrations/
          cp supabase/migrations/20261006122416_shopify_full_sync_state.sql /tmp/nestory-forward-migrations/
          cp supabase/migrations/20261006121816_publish_schedule_core.sql /tmp/nestory-forward-migrations/

          # Migration 032 relies on pg_temp objects declared ON COMMIT DROP.
          # The hosted migration runner executes a migration transactionally;
          # our controlled psql replay must model that for this file only.
          tmp_file="$(mktemp)"
          {
            echo 'begin;'
            cat /tmp/nestory-migrations/032_ip_catalog_v3_100_ips.sql
            echo 'commit;'
          } > "$tmp_file"
          mv "$tmp_file" /tmp/nestory-migrations/032_ip_catalog_v3_100_ips.sql

          # Active tracked migrations are state assertions / forward changes from
          # the 2026-08-18 baseline, not a blank-database bootstrap chain.
          # Forward migrations are staged separately above for explicit
          # apply/rollback/re-apply gates before this queue is removed.
          rm supabase/migrations/*.sql
          echo "Pre-tracking SQL and forward migrations staged for controlled local replay."

      - name: Start isolated local database
        run: supabase db start

      - name: Rebuild production-like baseline and test reconciliation
        env:
          MIGRATION_SOURCE_DIR: /tmp/nestory-migrations
        run: bash scripts/test-supabase-reconcile-local.sh

      - name: Test role, draft, archive, and batch RLS runtime
        run: bash scripts/test-supabase-role-rls-local.sh

      - name: Test trigger and event-trigger EXECUTE hardening
        run: bash scripts/test-supabase-function-hardening-local.sh

      - name: Test scheduled publish migration and runtime guards
        run: bash scripts/test-publish-schedule-local.sh

      - name: Test production precheck/apply/rollback/postcheck package
        run: bash scripts/test-supabase-production-package-local.sh

      - name: Export local-only app environment
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SCHEDULE_E2E_BASE_URL=http://127.0.0.1:3019"
            echo "PUBLISH_SCHEDULE_DB_WRITE_ENABLED=true"
            echo "PUBLISH_SCHEDULE_STAGING_ENABLED=false"
            echo "PUBLISH_SCHEDULE_EXECUTION_ENABLED=false"
            echo "SHOPIFY_PUBLISH_MOCK=true"
            echo "NEXT_TELEMETRY_DISABLED=1"
          } >> "$GITHUB_ENV"

      - name: Start local Next.js schedule API
        shell: bash
        run: |
          nohup pnpm exec next dev --hostname 127.0.0.1 --port 3019 > /tmp/nestory-schedule-e2e-next.log 2>&1 &
          echo $! > /tmp/nestory-schedule-e2e-next.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3019/login >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nestory-schedule-e2e-next.log || true
          exit 1

      - name: Test authenticated schedule HTTP API E2E
        run: pnpm run test:publish-schedule-api-e2e

      - name: Stop local Next.js schedule API
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/nestory-schedule-e2e-next.pid ]]; then
            kill "$(cat /tmp/nestory-schedule-e2e-next.pid)" 2>/dev/null || true
          fi
          cat /tmp/nestory-schedule-e2e-next.log || true

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup || true
