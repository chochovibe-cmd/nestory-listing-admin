function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderBody(html) {
  const box = el("div", "body");
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  for (const n of doc.body.children) {
    if (n.tagName === "H2") box.append(el("h3", null, n.textContent));
    else if (n.tagName === "UL") { const ul = el("ul"); for (const li of n.querySelectorAll("li")) ul.append(el("li", null, li.textContent)); box.append(ul); }
    else if (n.textContent.trim()) box.append(el("p", null, n.textContent));
  }
  if (!box.childElementCount) box.append(el("p", "empty", "（空）"));
  return box;
}
function renderFaq(text) {

}

      const seo = el("div", "seo"); seo.append(el("div", "st", v.seoTitle || "（空）"), el("div", null, v.meta || "（空）"));
      card.append(field("Google 搜尋結果（SEO 標題＋描述）", seo));
      card.append(field("商品描述", renderBody(v.desc)));
      const hl = el("ul"); for (const h of v.highlights) hl.append(el("li", null, h));
      card.append(field("商品亮點", v.highlights.length ? hl : el("p", "empty", "（空）")));
      card.append(field("為什麼潮巢選它", v.why ? el("p", null, v.why) : el("p", "empty", "（留空，頁面不顯示）")));
      card.append(field("問與答 FAQ", renderFaq(v.faq)));
    }
    const rate = el("div", "rate");
    for (let s = 1; s <= 5; s++) {
      const b = el("button", null, String(s)); b.type = "button"; b.disabled = true; b.setAttribute("aria-pressed", "false");
      b.setAttribute("aria-label", key + " 給 " + s + " 分");
      b.addEventListener("click", () => setScore(key, s));
      b.dataset.key = key; b.dataset.s = s; buttons.push(b); rate.append(b);
    }
    const note = el("textarea"); note.id = "note-" + key; note.placeholder = "想說的話（選填）"; note.disabled = true;
    note.addEventListener("input", () => { (state.scores[key] ??= {}).note = note.value; queueSave(); });
    card.append(rate, note, el("div", "lockmsg", "看完一輪後才能打分"));
    sec.append(card);
  }
  list.append(sec);
});
const total = ITEMS.reduce((n, it) => n + it.versions.filter(v => !v.failed).length, 0);
function paint() {
  for (const b of buttons) { b.disabled = !state.unlocked; b.setAttribute("aria-pressed", String(state.scores[b.dataset.key]?.score === Number(b.dataset.s))); }
  document.querySelectorAll("textarea").forEach(t => { t.disabled = !state.unlocked; const k = t.id.slice(5); if (document.activeElement !== t) t.value = state.scores[k]?.note || ""; });
  document.querySelectorAll(".lockmsg").forEach(m => m.hidden = state.unlocked);
  document.getElementById("go").hidden = state.unlocked;
  const n = Object.values(state.scores).filter(s => s && s.score).length;
  document.getElementById("done").textContent = "已打 " + n + " / " + total;
}
function setScore(key, s) { (state.scores[key] ??= {}).score = s; paint(); queueSave(); }
document.getElementById("go").addEventListener("click", () => { state.unlocked = true; paint(); queueSave(); });
let db = null, ref = null, timer = null, saving = false, again = false;
const saveMsg = document.getElementById("save");
function queueSave() { clearTimeout(timer); timer = setTimeout(save, 600); saveMsg.textContent = "儲存中…"; }
async function save() {
  if (!ref) { saveMsg.textContent = "目前無法儲存，請重新整理"; return; }
  if (saving) { again = true; return; }
  saving = true;
  try { await ref.set({ scores: state.scores, unlocked: state.unlocked }); saveMsg.textContent = "已存到雲端"; }
  catch (e) { saveMsg.textContent = "儲存失敗，請稍後再點一次分數"; }
  saving = false; if (again) { again = false; save(); }
}
paint();
(async () => {
  try {
    db = await window.claude?.use?.("db");
    if (!db) { saveMsg.textContent = "要登入才能存分數"; return; }
    ref = db.doc("blindtest2/scores");
    const snap = await ref.get();
    const data = snap && snap.exists ? snap.data() : null;
    // Snapshots are frozen; copy before editing.
    if (data && data.scores) { state.scores = JSON.parse(JSON.stringify(data.scores)); state.unlocked = !!data.unlocked; }
    saveMsg.textContent = "分數存在雲端";
    paint();
  } catch (e) { saveMsg.textContent = "讀取分數失敗，請重新整理"; }
})();
</script>
