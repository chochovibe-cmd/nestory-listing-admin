<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刊登利潤試算機</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --bg: #0d0d0f;
  --surface: #141418;
  --surface2: #1c1c22;
  --border: #2a2a38;
  --line: #2a2a38;
  --accent: #c8ff00;
  --accent-fg: #0e0e12;
  --accent2: #ff6b9d;
  --accent3: #c8a8ff;
  --text: #f0edf8;
  --text-muted: #a09ab8;
  --text-dim: #d8d3e8;
  --success: #3ecfb0;
  --warn: #f5c842;
  --radius-s: 12px;
  --radius-m: 16px;
  --radius-l: 20px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px;
  line-height: 1.6;
}

header {
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 2s infinite;
  flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.brand strong {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  display: block;
}
.brand span {
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
}

.container {
  margin: 0 auto;
  max-width: 1200px;
  padding: 24px;
}

.grid {
  display: grid;
  gap: 20px;
  grid-template-columns: 380px 1fr;
  align-items: start;
}

.panel {
  background: var(--surface);
  border: 2.5px solid var(--line);
  border-radius: var(--radius-m);
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
}

.panel-header {
  align-items: center;
  border-bottom: 2.5px solid var(--line);
  display: flex;
  justify-content: space-between;
  padding: 11px 16px;
  font-family: 'Space Grotesk', sans-serif;
}
.panel-header h2 {
  font-size: 12px;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--text-muted);
  font-weight: 700;
}

.panel-body { display: grid; gap: 14px; padding: 16px; }

.field { display: grid; gap: 6px; }
.field label {
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
}

input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  min-height: 38px;
  padding: 8px 11px;
  width: 100%;
  outline: none;
  transition: border-color .2s;
}
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(200,255,0,.15);
}

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

button {
  font: inherit;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-s);
  color: var(--text);
  cursor: pointer;
  min-height: 38px;
  padding: 8px 14px;
  transition: all .2s;
}
button:hover { border-color: var(--accent3); }

.btn-add {
  width: 100%;
  background: var(--accent);
  color: var(--accent-fg);
  border: 2.5px solid var(--line);
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .04em;
}
.btn-add:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 rgba(232,232,240,.30); }

.summary-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--surface);
  border: 2.5px solid var(--line);
  border-radius: var(--radius-m);
  padding: 14px 16px;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
}
.summary-card .label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  font-weight: 600;
}
.summary-card .value {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 20px;
  font-weight: 700;
  margin-top: 4px;
}
.value.pos { color: var(--success); }
.value.neg { color: var(--accent2); }

.results-list { display: grid; gap: 12px; }

.result-card {
  background: var(--surface);
  border: 2.5px solid var(--line);
  border-radius: var(--radius-m);
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,.18);
}
.result-card.neg-margin { border-color: color-mix(in srgb, var(--accent2) 45%, var(--line)); }

.rc-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 2.5px solid var(--line);
}
.rc-title {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rc-margin {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 999px;
  white-space: nowrap;
  border: 1px solid transparent;
}
.rc-margin.pos { color: var(--success); border-color: color-mix(in srgb, var(--success) 45%, var(--border)); }
.rc-margin.neg { color: var(--accent2); border-color: color-mix(in srgb, var(--accent2) 45%, var(--border)); }

.rc-del {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 16px;
  min-height: 0;
  padding: 2px 6px;
}
.rc-del:hover { color: var(--accent2); }

.rc-body { padding: 12px 14px 14px; }

.breakdown {
  display: grid;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
}
.breakdown-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}
.breakdown-row.total {
  border-top: 1px solid var(--border);
  margin-top: 4px;
  padding-top: 8px;
  font-weight: 700;
  font-family: 'Space Grotesk', sans-serif;
}
.breakdown-row .amt { color: var(--text); }
.breakdown-row.total .amt.pos { color: var(--success); }
.breakdown-row.total .amt.neg { color: var(--accent2); }

.empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
}
.empty-icon { font-size: 32px; margin-bottom: 12px; opacity: .3; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); }

@media (max-width: 860px) {
  .grid { grid-template-columns: 1fr; }
  .summary-bar { grid-template-columns: 1fr; }
  .container { padding: 14px; }
}
</style>
</head>
<body>
<header>
  <span class="brand-dot"></span>
  <div class="brand">
    <strong>刊登利潤試算機</strong>
    <span>Listing Profit Estimator</span>
  </div>
</header>

<div class="container">
  <div class="grid">
    <div class="panel">
      <div class="panel-header"><h2>新增商品試算</h2></div>
      <div class="panel-body">
        <div class="field">
          <label>商品名稱</label>
          <input type="text" id="f-name" placeholder="例：復古帆布托特包">
        </div>
        <div class="row2">
          <div class="field">
            <label>售價 (NT$)</label>
            <input type="number" id="f-price" placeholder="990" min="0">
          </div>
          <div class="field">
            <label>成本 (NT$)</label>
            <input type="number" id="f-cost" placeholder="320" min="0">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>平台抽成 (%)</label>
            <input type="number" id="f-platform" placeholder="5" min="0" step="0.1">
          </div>
          <div class="field">
            <label>金流手續費 (%)</label>
            <input type="number" id="f-payment" placeholder="2.8" min="0" step="0.1">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>運費 (NT$)</label>
            <input type="number" id="f-shipping" placeholder="60" min="0">
          </div>
          <div class="field">
            <label>其他成本 (NT$)</label>
            <input type="number" id="f-other" placeholder="0" min="0">
          </div>
        </div>
        <button class="btn-add" id="add-btn">＋ 加入試算</button>
      </div>
    </div>

    <div>
      <div class="summary-bar" id="summary-bar" style="display:none;">
        <div class="summary-card">
          <div class="label">商品數量</div>
          <div class="value" id="sum-count">0</div>
        </div>
        <div class="summary-card">
          <div class="label">總淨利</div>
          <div class="value" id="sum-profit">NT$0</div>
        </div>
        <div class="summary-card">
          <div class="label">平均利潤率</div>
          <div class="value" id="sum-margin">0%</div>
        </div>
      </div>

      <div id="results-list" class="results-list"></div>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">◈</div>
        <div>尚未加入任何商品，於左側輸入資料後按「加入試算」</div>
      </div>
    </div>
  </div>
</div>

<script>
const items = [];
let uid = 0;

const $ = (id) => document.getElementById(id);
const fmt = (n) => 'NT$' + Math.round(n).toLocaleString('zh-Hant');

function calc(item) {
  const platformFee = item.price * (item.platform / 100);
  const paymentFee = item.price * (item.payment / 100);
  const totalCost = item.cost + item.shipping + item.other + platformFee + paymentFee;
  const profit = item.price - totalCost;
  const margin = item.price > 0 ? (profit / item.price) * 100 : 0;
  return { platformFee, paymentFee, totalCost, profit, margin };
}

function render() {
  const list = $('results-list');
  const empty = $('empty-state');
  const summaryBar = $('summary-bar');

  if (items.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    summaryBar.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  summaryBar.style.display = 'grid';

  let totalProfit = 0, totalMargin = 0;
  list.innerHTML = items.map(item => {
    const r = calc(item);
    totalProfit += r.profit;
    totalMargin += r.margin;
    const marginClass = r.margin >= 0 ? 'pos' : 'neg';
    return `
      <div class="result-card ${r.margin < 0 ? 'neg-margin' : ''}">
        <div class="rc-header">
          <div class="rc-title">${escapeHtml(item.name || '未命名商品')}</div>
          <div class="rc-margin ${marginClass}">${r.margin.toFixed(1)}%</div>
          <button class="rc-del" data-id="${item.id}" title="刪除">✕</button>
        </div>
        <div class="rc-body">
          <div class="breakdown">
            <div class="breakdown-row"><span>售價</span><span class="amt">${fmt(item.price)}</span></div>
            <div class="breakdown-row"><span>成本</span><span class="amt">-${fmt(item.cost)}</span></div>
            <div class="breakdown-row"><span>運費</span><span class="amt">-${fmt(item.shipping)}</span></div>
            <div class="breakdown-row"><span>平台抽成 (${item.platform}%)</span><span class="amt">-${fmt(r.platformFee)}</span></div>
            <div class="breakdown-row"><span>金流手續費 (${item.payment}%)</span><span class="amt">-${fmt(r.paymentFee)}</span></div>
            ${item.other > 0 ? `<div class="breakdown-row"><span>其他成本</span><span class="amt">-${fmt(item.other)}</span></div>` : ''}
            <div class="breakdown-row total"><span>淨利</span><span class="amt ${marginClass}">${fmt(r.profit)}</span></div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  $('sum-count').textContent = items.length;
  const avgMargin = totalMargin / items.length;
  $('sum-profit').textContent = fmt(totalProfit);
  $('sum-profit').className = 'value ' + (totalProfit >= 0 ? 'pos' : 'neg');
  $('sum-margin').textContent = avgMargin.toFixed(1) + '%';
  $('sum-margin').className = 'value ' + (avgMargin >= 0 ? 'pos' : 'neg');

  list.querySelectorAll('.rc-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.id);
      const idx = items.findIndex(i => i.id === id);
      if (idx !== -1) items.splice(idx, 1);
      render();
    });
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

$('add-btn').addEventListener('click', () => {
  const name = $('f-name').value.trim();
  const price = parseFloat($('f-price').value) || 0;
  const cost = parseFloat($('f-cost').value) || 0;
  const platform = parseFloat($('f-platform').value) || 0;
  const payment = parseFloat($('f-payment').value) || 0;
  const shipping = parseFloat($('f-shipping').value) || 0;
  const other = parseFloat($('f-other').value) || 0;

  if (price <= 0) {
    $('f-price').focus();
    $('f-price').style.borderColor = 'var(--accent2)';
    setTimeout(() => { $('f-price').style.borderColor = ''; }, 1000);
    return;
  }

  items.unshift({ id: uid++, name, price, cost, platform, payment, shipping, other });
  render();

  ['f-name','f-price','f-cost','f-platform','f-payment','f-shipping','f-other'].forEach(id => $(id).value = '');
  $('f-name').focus();
});

document.querySelectorAll('input[type="number"]').forEach(inp => {
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('add-btn').click();
  });
});

render();
</script>
</body>
</html>
