name: Mobile ResultCard R3 patch

on:
  push:
    branches:
      - agent/release-thumbnail-regression-fix

permissions:
  contents: write

jobs:
  apply-r3:
    if: github.event.head_commit.message == 'chore: trigger mobile ResultCard R3 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply owner-confirmed mobile R3 patch
        env:
          CLEAN_BASE: 00d8cda5163cc5cf4b92298a4d19c29fbba8ffe4
          BRANCH_NAME: agent/release-thumbnail-regression-fix
        run: |
          python - <<'PY'
          from pathlib import Path

          # ResultCard: add a real mobile-only inline station/date immediately after title.
          p = Path('src/components/listing/ResultCard.tsx')
          s = p.read_text()
          anchor = '''  const titleRowEl = (\n    <span className="rc-title-row">\n      <span className="rc-title">{draft.title_zh || draft.taobao_title || "商品草稿"}</span>\n'''
          replacement = '''  const mobileCardPrimary = stationFlowPrimaryLabel(draft);\n  const mobileCardTimeLabel = formatRelativeTime(draft.created_at);\n  const mobileCardTimeTitle = formatAbsoluteLocalTime(draft.created_at);\n\n  const titleRowEl = (\n    <span className="rc-title-row">\n      <span className="rc-title-flow">\n        <span className="rc-title">{draft.title_zh || draft.taobao_title || "商品草稿"}</span>\n        {isNarrow ? (\n          <span\n            className={\n              mobileCardPrimary.kind === "fail"\n                ? "schip schip--error rc-title-inline-station"\n                : "schip schip--run rc-title-inline-station"\n            }\n          >\n            {mobileCardPrimary.label}\n          </span>\n        ) : null}\n        {isNarrow && mobileCardTimeLabel ? (\n          <span className="rc-title-inline-time muted" title={mobileCardTimeTitle || undefined}>\n            {mobileCardTimeLabel}\n          </span>\n        ) : null}\n      </span>\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'ResultCard title anchor drifted: {s.count(anchor)} matches')
          p.write_text(s.replace(anchor, replacement, 1))

          # DraftResultsPanel: expose copy-review soft remove as a real first-level action.
          p = Path('src/components/listing/DraftResultsPanel.tsx')
          s = p.read_text()
          class_anchor = '            className="rc-batch-strip"\n'
          class_replacement = '''            className={`rc-batch-strip${\n              isCopyStation\n                ? " rc-batch-strip--copy"\n                : isImageStation\n                  ? " rc-batch-strip--image"\n                  : isReadyStation\n                    ? " rc-batch-strip--ready"\n                    : ""\n            }`}\n'''
          if s.count(class_anchor) != 1:
              raise SystemExit(f'Batch strip class anchor drifted: {s.count(class_anchor)} matches')
          s = s.replace(class_anchor, class_replacement, 1)

          old = '''                  <details className="batch-more">\n                    <summary className="nb-btn nb-btn--secondary nb-btn--sm">更多 ▾</summary>\n                    <div className="batch-more-menu">\n                      <Button\n                        size="sm"\n                        fullWidth\n                        disabled={busy || !selectedArray.length}\n                        onClick={() => void batchArchiveOrUnarchive("archive")}\n                        title="移出工作佇列（軟刪除，可救回）"\n                        type="button"\n                      >\n                        🗄 移出佇列\n                      </Button>\n                    </div>\n                  </details>\n'''
          new = '''                  <Button\n                    size="sm"\n                    className="batch-remove-action"\n                    disabled={busy || !selectedArray.length}\n                    onClick={() => void batchArchiveOrUnarchive("archive")}\n                    title="移出工作佇列（軟刪除，可救回）"\n                    type="button"\n                  >\n                    移出佇列\n                  </Button>\n'''
          if s.count(old) != 1:
              raise SystemExit(f'Copy More anchor drifted: {s.count(old)} matches')
          p.write_text(s.replace(old, new, 1))

          # Mobile-only final override. Existing refinement stays as documented history underneath.
          p = Path('src/app/resultcard-mobile-release.css')
          css = p.read_text()
          marker = '/* OWNER-R3-2026-08-20 */'
          if marker in css:
              raise SystemExit('R3 marker already exists; refusing duplicate patch')
          css += r'''

/* OWNER-R3-2026-08-20
 * Final mobile hierarchy correction after iPhone review.
 * Presentation only: no gesture/API/upload/Variant/Shopify/Supabase behavior here.
 */
@media (max-width: 959px) {
  /* True natural flow: title -> station -> date. */
  .result-card > .rc-header .rc-title-flow {
    grid-column: 1 / -1;
    grid-row: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 7px;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    padding-right: 18px;
    box-sizing: border-box;
  }
  .result-card > .rc-header .rc-title-flow > .rc-title {
    position: static;
    display: inline;
    flex: 0 0 auto;
    width: fit-content;
    max-width: 100%;
    min-width: 0;
    padding: 0;
    font-weight: 800;
    line-height: 1.34;
    overflow-wrap: anywhere;
  }
  .result-card > .rc-header .rc-title-inline-station,
  .result-card > .rc-header .rc-title-inline-time {
    flex: 0 0 auto;
    white-space: nowrap;
  }
  .result-card > .rc-header .rc-title-inline-station { font-size: 11px; }
  .result-card > .rc-header .rc-title-inline-time { font-size: 11px; }
  .result-card > .rc-header .rc-head-meta .rc-station-chip,
  .result-card > .rc-header .rc-head-meta .rc-time-ago {
    display: none;
  }

  /* Card X straddles the top border, outside the content flow. */
  .result-card > .rc-header > .rc-quick-row > .rc-dismiss-btn {
    top: 0 !important;
    right: 10px !important;
    transform: translateY(-50%) !important;
  }
  .result-card > .rc-header > .rc-quick-row > .rc-dismiss-btn:active {
    transform: translateY(-50%) scale(.92) !important;
  }

  /* Balanced image-left / metadata-right summary. */
  .result-card > .rc-header {
    grid-template-columns: 94px minmax(0, 1fr) max-content max-content;
  }
  .result-card > .rc-header > .rc-thumb {
    width: 94px;
    height: 94px;
    min-width: 94px;
    min-height: 94px;
  }

  /* Flatten price wrappers so sale / strike / profit are real peer items. */
  .result-card > .rc-header .rc-price-mini {
    display: flex;
    flex-wrap: nowrap;
    align-items: baseline;
    gap: 4px 7px;
    overflow: hidden;
  }
  .result-card > .rc-header .rc-price-mini-main,
  .result-card > .rc-header .rc-price-mini-sub {
    display: contents;
  }
  .result-card > .rc-header .rc-price-mini-label,
  .result-card > .rc-header .rc-price-mini-value,
  .result-card > .rc-header .rc-price-mini-strike,
  .result-card > .rc-header .rc-price-mini-profit {
    white-space: nowrap;
  }
  .result-card > .rc-header .rc-price-mini-value { flex: 0 0 auto; }
  .result-card > .rc-header .rc-price-mini-strike,
  .result-card > .rc-header .rc-price-mini-profit {
    flex: 0 1 auto;
    min-width: 0;
  }

  /* Equal peers, but use the smaller owner-preferred control height. */
  .stage-filter-row .results-scope-label,
  .stage-filter-row .results-sort-label,
  .stage-filter-row .ir-scope-select,
  .stage-filter-row .sort-sel {
    height: 38px !important;
    min-height: 38px !important;
  }

  /* Generation title + compact sequential review share row 1; select-all stays row 2. */
  .rc-panel-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 7px 9px;
  }
  .rc-panel-header > h2 {
    grid-column: 1;
    grid-row: 1;
    min-width: 0;
    margin: 0;
    font-size: 14px;
    line-height: 1.25;
  }
  .rc-panel-header > .rc-header-actions { display: contents; }
  .rc-panel-header .rc-header-seq-btn {
    grid-column: 2;
    grid-row: 1;
    width: auto;
    min-width: 0;
    height: 34px;
    min-height: 34px;
    padding: 4px 8px;
    font-size: 11px;
    white-space: nowrap;
  }
  .rc-panel-header .rc-header-select-all {
    grid-column: 1 / -1;
    grid-row: 2;
    justify-self: start;
    min-height: 30px;
    margin: 0;
  }

  /* Copy-review: count on top, then Cancel / Approve / Remove directly. */
  .rc-batch-strip--copy {
    display: grid !important;
    grid-template-columns: .82fr 1.12fr 1.16fr;
    align-items: stretch;
    gap: 7px;
    padding: 10px;
  }
  .rc-batch-strip--copy .rc-batch-count {
    grid-column: 1 / -1;
    grid-row: 1;
    margin: 0 0 1px;
  }
  .rc-batch-strip--copy .rc-batch-actions { display: contents !important; }
  .rc-batch-strip--copy .rc-batch-cancel,
  .rc-batch-strip--copy .batch-primary-action,
  .rc-batch-strip--copy .batch-remove-action {
    grid-row: 2;
    width: 100%;
    min-width: 0;
    height: 38px;
    min-height: 38px;
    padding-inline: 6px;
    font-size: 11px;
    white-space: nowrap;
  }
  .rc-batch-strip--copy .rc-batch-cancel { grid-column: 1; }
  .rc-batch-strip--copy .batch-primary-action { grid-column: 2; }
  .rc-batch-strip--copy .batch-remove-action {
    grid-column: 3;
    border-color: color-mix(in srgb, var(--danger) 36%, var(--border));
    background: color-mix(in srgb, var(--danger) 6%, var(--surface));
    color: color-mix(in srgb, var(--danger) 72%, var(--text));
  }
}

@media (max-width: 420px) {
  .result-card > .rc-header {
    grid-template-columns: 88px minmax(0, 1fr) max-content max-content;
  }
  .result-card > .rc-header > .rc-thumb {
    width: 88px;
    height: 88px;
    min-width: 88px;
    min-height: 88px;
  }
  .result-card > .rc-header .rc-title-inline-station,
  .result-card > .rc-header .rc-title-inline-time { font-size: 10px; }
  .rc-batch-strip--copy { gap: 5px; }
  .rc-batch-strip--copy .rc-batch-cancel,
  .rc-batch-strip--copy .batch-primary-action,
  .rc-batch-strip--copy .batch-remove-action {
    padding-inline: 4px;
    font-size: 10.5px;
  }
}
'''
          p.write_text(css)

          # Update the existing small verifier rather than creating another overlapping verifier.
          Path('scripts/verify-mobile-resultcard-owner-refine.mjs').write_text(r'''import assert from "node:assert/strict";
import fs from "node:fs";

const css = fs.readFileSync("src/app/resultcard-mobile-release.css", "utf8");
const card = fs.readFileSync("src/components/listing/ResultCard.tsx", "utf8");
const panel = fs.readFileSync("src/components/listing/DraftResultsPanel.tsx", "utf8");

assert.match(css, /OWNER-R3-2026-08-20/);
assert.match(card, /className="rc-title-flow"[\s\S]*rc-title-inline-station[\s\S]*rc-title-inline-time/);
assert.match(card, /mobileCardPrimary = stationFlowPrimaryLabel\(draft\)/);
assert.match(css, /\.rc-title-flow[\s\S]*display:\s*flex;[\s\S]*flex-wrap:\s*wrap;/);
assert.match(css, /\.rc-head-meta \.rc-station-chip,[\s\S]*\.rc-head-meta \.rc-time-ago[\s\S]*display:\s*none;/);
assert.match(css, /\.rc-dismiss-btn[\s\S]*top:\s*0\s*!important;[\s\S]*translateY\(-50%\)/);
assert.match(css, /grid-template-columns:\s*94px\s+minmax\(0,\s*1fr\)/);
assert.match(css, /\.rc-price-mini-main,[\s\S]*\.rc-price-mini-sub[\s\S]*display:\s*contents;/);
assert.match(css, /\.results-scope-label,[\s\S]*\.results-sort-label[\s\S]*38px/);
assert.match(css, /\.rc-panel-header > \.rc-header-actions\s*\{\s*display:\s*contents;/);
assert.match(panel, /rc-batch-strip--copy/);
assert.match(panel, /className="batch-remove-action"[\s\S]*batchArchiveOrUnarchive\("archive"\)/);
assert.match(panel, /batchSetGenerateDetail\(true\)/);
assert.match(panel, /batchSetGenerateDetail\(false\)/);
assert.match(card, /export const LONG_PRESS_MS = 500;/);
assert.match(card, /GESTURE_MOVE_PX = 10;/);
assert.match(card, /async function archiveOne\(\)/);
assert.match(card, /function handleHeaderClick\(\)/);
console.log("Mobile ResultCard owner R3 checks passed");
''')

          # R3 audit.
          Path('docs/audits/RESULTCARD-MOBILE-OWNER-CORRECTION-R3-2026-08-20.md').write_text('''# ResultCard Mobile Owner Correction R3 — 2026-08-20

## Scope

Owner clarified the mobile hierarchy after iPhone review. This pass changes only ResultCard/results mobile presentation plus the minimum DOM required for exact ordering and direct copy-review archive access.

## Final requested hierarchy

- `只看我的` / `最新在上`: equal width, equal **38px** height (smaller original preferred size).
- Card top flow: **title → station label → date** as natural inline wrapping text flow. Station/date are not pinned to a separate right column.
- Summary: image left, sale status + tags + warnings right; mobile image anchor 94px (88px on <=420px).
- Price: sale value + compare-at strike + profit/percentage share one visual baseline row.
- Card `×`: existing `archiveOne()` soft-remove control visually straddles the top border; undo semantics unchanged.
- Panel header: `生成結果（三站工作佇列）` and compact `逐件審核/逐件標圖` share row 1; select-all remains below.
- Copy-review batch selection: direct **取消 / 批次核准 / 移出佇列** peer buttons. `移出佇列` reuses existing batch soft archive endpoint.
- Image-review keeps its real multi-action `更多` menu.

## Minimum source changes

### ResultCard.tsx
Adds mobile-only station/date immediately after the title using existing canonical `stationFlowPrimaryLabel` and time formatters. No gesture/review/archive/publish handler changed.

### DraftResultsPanel.tsx
Adds station-specific batch strip class and promotes the existing copy-review archive action from a one-item `更多` menu to a first-level button. Image-review More remains unchanged.

## Explicit C guard

No changes to ImageUploader, Variant, Supabase, Shopify, auth/roles, API routes, long-press timing, swipe math, archive semantics, or desktop behavior.

## Runtime gate

Validate on iPhone: short/long title wrapping, top-border X + undo, balanced summary, single-line price, 38px controls, compact panel header, direct three-button copy batch toolbar, image-review More, long-press/swipe/tap-expand behavior.
''')

          # Concise current-status insert.
          p = Path('docs/CURRENT_STATUS.md')
          s = p.read_text()
          marker = '## 0. ResultCard mobile R3 — awaiting iPhone validation'
          if marker not in s:
            anchor = '目前 release 分支：`agent/release-thumbnail-regression-fix`\n'
            block = '''\n## 0. ResultCard mobile R3 — awaiting iPhone validation\n\nLatest owner contract: natural `title → station → date` flow; balanced image/right summary; one-line sale/strike/profit; card X on border; 38px scope/sort; compact generation+sequential header; direct copy batch `取消 / 批次核准 / 移出佇列`.\n\nOnly ResultCard title rendering, DraftResultsPanel copy batch action exposure, mobile release CSS, verifier/docs changed. **No uploader / Variant / Supabase / Shopify / API / gesture-math changes.**\n\nSee `docs/audits/RESULTCARD-MOBILE-OWNER-CORRECTION-R3-2026-08-20.md`.\n'''
            if anchor not in s:
              raise SystemExit('CURRENT_STATUS anchor missing')
            s = s.replace(anchor, anchor + block, 1)
            p.write_text(s)

          # Append-only changelog.
          p = Path('docs/CHANGELOG.md')
          s = p.read_text()
          marker = '## 2026-08-20 — ResultCard mobile owner correction R3'
          if marker not in s:
            s += '''\n\n## 2026-08-20 — ResultCard mobile owner correction R3\n\n- Mobile ResultCard top flow now follows title → station → date naturally.\n- Card soft-remove X moved onto the top border; existing undo path unchanged.\n- Mobile image/right-info balance and one-line price row refined.\n- Scope/sort controls standardized at 38px.\n- Generation title and compact sequential-review action share the first header row.\n- Copy-review batch toolbar now exposes direct Cancel / Approve / Remove; image-review More preserved.\n- No uploader, Variant, Supabase, Shopify, API, role, long-press timing, or swipe-math changes.\n'''
            p.write_text(s)
          PY

          node scripts/verify-mobile-resultcard-owner-refine.mjs
          node scripts/verify-mobile-resultcard-expand.mjs
          node scripts/verify-mobile-layout-regression-restore.mjs
          git diff --check

          # Squash the prior refinement + this R3 into one clean commit on top of 00d8cda.
          git config user.name "chochovibe-cmd"
          git config user.email "chochovibe@gmail.com"
          git reset --soft "$CLEAN_BASE"
          rm -f .github/workflows/mobile-resultcard-r3.yml
          git add -A
          git diff --cached --check
          git commit -m "style(mobile): finalize ResultCard owner layout"
          git push --force-with-lease=refs/heads/$BRANCH_NAME:$GITHUB_SHA origin HEAD:$BRANCH_NAME
